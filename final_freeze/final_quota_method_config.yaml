# =============================================================================
# FINAL QUOTA METHOD — FROZEN CONFIGURATION (single source of truth)
# =============================================================================
# Human-readable mirror of final_quota_method_config.json (identical content).
# The runtime (final_freeze/src/operational_quota.py) reads the .json twin.
# paper parameters == frozen config == runtime parameters.
# =============================================================================

method_version: "2026-09-freeze"
dataset_version: "D2 = 280 + 120 = 400 combos (29/30 corrected reference)"
git_commit: "c5bf01def5dcfefe06908ba3f67346e74cf045b6"

nominal_model:
  form: "q_hat_nom = c * W * (q_p / W)^p"
  c: 24.37
  p: -0.945
  width_exponent: {value: 0.992, se: 0.154, note: "CI includes 1 -> keep W^1"}

safety_margin:
  method: "additive"          # subtract in quota units; NOT multiplicative
  delta: 3.1068               # pooled Q0.80 positive residual (D80_FROZEN)
  note: "operational +Q80 uses LOCO fold-calibrated Q80 margins (per held-out city);
         Delta_80=3.1068 is the pooled representative value"

baseline_qualification:
  engine: "Eclipse SUMO + JuPedSim"
  seeds: 30
  pass_threshold: ">= 29/30 (>= 0.95)"   # qr_star reference criterion
  density_limit: 1.20         # ped/m^2
  flow_ratio_min: 0.90
  flow_ratio_max: 1.20
  note: "speed retention is vacuous at q_r = 0 and is excluded. NOTE: deployed
         base_pass column is MEAN-based (mean_density<=1.20 AND
         0.90<=mean_flow_ratio<=1.20 over q_r=0 seeds), differing from the per-seed
         >=29/30 rule in 8/400 decoupled high-qp rows; qr_star itself is 29/30."

guardrails:
  W_min: 1.6                  # m
  x_crit: 33.333333333333336  # ped/min/m
  q_max: 20.0                 # robot/min (verified sweep ceiling)
  Q_low:                      # low-flow ceiling (removes x->0 divergence)
    W: [1.5, 1.6, 1.7, 1.8, 2.1, 2.4, 2.7, 3.0]
    Q: [0.0, 5.0, 6.0, 8.0, 10.0, 18.0, 20.0, 20.0]
  C_W:                        # W-dependent robot-admissible pedestrian capacity
    W: [1.5, 1.6, 1.7, 1.8, 2.1, 2.4, 2.7, 3.0]
    C: [10.0, 35.0, 35.0, 45.0, 45.0, 55.0, 90.0, 90.0]
  sharp_corner_guard:
    max_turn_min_deg: 20.0
    cum_turn_min_deg: 20.0
    concentration_min: 0.6     # max_turn / cum_turn
  absolute_speed_floor:
    vbar_min: 0.8              # m/s

execution_order:
  - OOD
  - base_pass
  - zero_guards
  - nominal
  - margin
  - Q_low
  - q_max
  - floor

applicability_domain:
  W_range: [1.6, 3.0]          # m
  q_p_max: 60.0                # ped/min
  x_max: 33.333333333333336    # q_p / W
  geometry: "Type A, or Type B with sinuosity <= 1.05; no barriers; no sharp concentrated corners"
  ood_rule: "out-of-domain fallback — NO closed-form recommendation"

dataset:
  path: "data/final/full_reference_dataset.csv"   # recovered from D:\quota_experiment
  sha256: "b2b6743d22b3fe4496cc11022c65eaf7b80508efa2996cb8f5538049fc4144e9"
  rows: 400                    # 280 main + 120 decoupled (verified)
  cities: ["amsterdam", "melbourne", "newtaipei", "nyc", "taipei", "seattle", "taoyuan"]

code:
  commit: "c5bf01def5dcfefe06908ba3f67346e74cf045b6"
  runtime: "final_freeze/src/operational_quota.py"

headline_results:
  overprediction_chain_pct: [25.75, 6.75, 2.75]   # nominal -> +Q80 -> +baseline guard
  max_overprediction_chain: [19, 16, 7]
  mean_conservative_loss: 2.623
  median_utilization: 0.25
  loco_mae_model_A: 2.189
